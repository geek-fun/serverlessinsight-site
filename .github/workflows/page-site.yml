name: generate page site
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Job 1: Build and validate
  build:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run docs:build

      - name: Check for version change
        id: version_check
        run: ./scripts/check-version.sh . v

  # Job 2: Deploy (only if version changed and on master)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run docs:build

      - name: Install ServerlessInsight
        run: npm install -g @geek-fun/serverlessinsight

      - name: Deploy to Aliyun By ServerlessInsight
        run: si deploy --stage prod --auto-approve
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID_PROD }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET_PROD }}
          ALIYUN_REGION: singapore

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: serverlessinsight-site
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          environment: production

  # Job 3: Create Release (only after successful deployment)
  release:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/master' && needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: jaywcjlove/changelog-generator@main
        id: changelog
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ServerlessInsight Site ${{ needs.build.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.compareurl }}

            ${{ steps.changelog.outputs.changelog }}
          make_latest: true
