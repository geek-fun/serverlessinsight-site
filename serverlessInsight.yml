version: 0.1.0

provider:
  name: aliyun
  region: ap-southeast-1

app: serverlessinsight
service: serverlessinsight-site

# Full resource names are declared per stage and referenced whole below —
# the CLI schema rejects mixed literal+${ctx.stage} interpolation (0.8.5+).
stages:
  prod:
    site_bucket_name: serverlessinsight-site-bucket-prod

backend:
  state_manager:
    type: BUCKET_STORE
    bucket: wentsen-serverless-insight-state-prod
    key: serverlessinsight/serverlessinsight-site/state.json

tags:
  owner: wentsen
  group: serverlessinsight

buckets:
  si_spa_site_bucket:
    name: ${stages.site_bucket_name}
    security:
      acl: PUBLIC_READ
    website:
      code: dist
      index: index.html
      domain:
        domain_name: serverlessinsight.com
        certificate_id: '25778342'
        protocol: HTTPS
        www_bind_apex: true
