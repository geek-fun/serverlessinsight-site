version: 0.0.1

provider:
  name: aliyun
  region: ap-southeast-1

app: serverlessinsight
service: serverlessinsight-site

backend:
  state_manager:
    type: BUCKET_STORE
    bucket: wentsen-serverless-insight-state-prod
    key: frog-coo/frog-coo-api/state.json

tags:
  owner: wentsen
  group: serverlessinsight

buckets:
  si_spa_site_bucket:
    name: serverlessinsight-site-bucket-${ctx.stage}
    security:
      acl: PUBLIC_READ
    website:
      code: dist
      index: index.html
      error_page: 404.html
      error_code: 404
      domain: www.serverlessinsight.com
